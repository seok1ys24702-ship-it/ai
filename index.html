<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>중앙 AI 도시 교통 통합 관제 — 장주기 신호/횡단보도 비교</title>
<style>
:root{
  --bg:#060d1a;--panel:#0b1628;--panel2:#0f1e35;--border:#1e3050;
  --text:#e8f4ff;--muted:#7f9bbb;--road:#314868;--red:#e84040;
  --yellow:#f5c518;--blue:#1ab8e8;--green:#22e87a;--orange:#f07830;
  --purple:#a060f8;--divider:#162540;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",system-ui,sans-serif;font-size:13px}
#header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#080f1e;border-bottom:1px solid var(--border);position:relative;z-index:100;flex-shrink:0}
#header h1{font-size:15px;font-weight:900;letter-spacing:-.4px;color:#cde8ff}
#header h1 span{color:var(--blue)}
.hright{display:flex;align-items:center;gap:12px}.scen-btns{display:flex;gap:6px}
.sbtn{height:32px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:#0f1e35;color:var(--muted);font-size:12px;font-weight:800;cursor:pointer;transition:all .18s;white-space:nowrap}
.sbtn:hover{border-color:var(--blue);color:var(--text);background:#162a40}
.sbtn.active{border-color:var(--blue);color:var(--blue);background:#0d2238;box-shadow:0 0 10px rgba(26,184,232,.2)}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}.live-label{font-size:11px;color:var(--green);font-family:monospace;font-weight:800}
#app{display:grid;grid-template-columns:1fr 1fr 270px;height:calc(100vh - 52px);gap:0}
.map-col{position:relative;overflow:hidden;border-right:1px solid var(--divider)}
.map-col:last-of-type{border-right:2px solid #1e3a5c}
.map-header{position:absolute;top:0;left:0;right:0;z-index:70;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(to bottom,rgba(6,13,26,.96) 70%,transparent)}
.map-label-no,.map-label-ai{font-size:13px;font-weight:900;border-radius:6px;padding:5px 10px;background:#080f1e;letter-spacing:.3px}
.map-label-no{color:var(--muted);border:1px solid var(--border)}
.map-label-ai{color:var(--blue);border:1px solid var(--blue);background:rgba(26,184,232,.08);box-shadow:0 0 12px rgba(26,184,232,.18)}
.map-congestion{font-size:12px;font-family:monospace;font-weight:800;color:var(--yellow)}
.map-area{position:absolute;inset:0;background:#070e1c;background-image:linear-gradient(rgba(20,40,65,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(20,40,65,.35) 1px,transparent 1px);background-size:54px 54px}
.zone-lbl{position:absolute;color:#5b7894;font-size:11px;font-weight:800;background:rgba(8,15,28,.78);border:1px solid #1e3050;border-radius:20px;padding:4px 8px;z-index:6;pointer-events:none}
.road{position:absolute;height:28px;background:var(--road);border-radius:999px;transform-origin:left center;border:1px solid rgba(255,255,255,.08);z-index:2;transition:background .35s,height .25s;cursor:pointer}
.road::after{content:"";position:absolute;left:9px;right:9px;top:50%;border-top:2px dashed rgba(255,255,255,.2);transform:translateY(-50%)}
.road.congested{background:var(--red);height:32px;z-index:3}.road.predicted{background:var(--yellow);height:32px;z-index:3}
.road.ai-ctrl{background:var(--blue);height:34px;z-index:4}.road.emergency{background:var(--green);height:36px;z-index:5}
.road.detour{outline:3px dashed var(--orange);outline-offset:3px}.road:hover{filter:brightness(1.4)}
.node{position:absolute;width:18px;height:18px;margin-left:-9px;margin-top:-9px;border-radius:50%;background:#07101d;border:2px solid #55718d;z-index:8}
.sig-wrap{position:absolute;z-index:30;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.sig-box{width:18px;height:42px;background:#050c18;border:1px solid #244467;border-radius:6px;display:flex;flex-direction:column;gap:2px;padding:3px;position:relative}
.sig-lbl{font-size:8px;color:#a9bdd2;background:#050c18;padding:1px 4px;border-radius:3px;white-space:nowrap;font-family:monospace}
.lite{border-radius:50%;flex:1;background:#101e30;transition:background .15s,box-shadow .15s}
.lite.r.on{background:var(--red);box-shadow:0 0 8px rgba(232,64,64,.85)}.lite.y.on{background:var(--yellow);box-shadow:0 0 6px rgba(245,197,24,.85)}.lite.g.on{background:var(--green);box-shadow:0 0 9px rgba(34,232,122,.9),0 0 18px rgba(34,232,122,.35)}
.sig-ai-badge{position:absolute;top:-6px;right:-6px;width:11px;height:11px;border-radius:50%;background:var(--blue);border:1.5px solid #060d1a}
.phase-tag{position:absolute;transform:translate(-50%,-50%);z-index:31;background:#07101dcc;border:1px solid #2b4a70;border-radius:999px;padding:2px 6px;font-size:9px;font-weight:900;color:#dcefff;pointer-events:none}
.crosswalk-on-road{position:absolute;left:50%;top:50%;width:38px;height:42px;transform:translate(-50%,-50%);z-index:20;pointer-events:auto;cursor:pointer;border-radius:4px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.96) 0 4px,transparent 4px 8px);box-shadow:0 0 8px rgba(255,255,255,.28)}
.crosswalk-on-road::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;border-top:1px solid rgba(255,255,255,.65);transform:translateY(-50%)}
.ped-sig{position:absolute;left:50%;top:-42px;z-index:55;transform:translateX(-50%);background:#07101d;border:1px solid #395878;border-radius:8px;padding:4px 8px;font-size:10px;font-weight:900;color:var(--red);box-shadow:0 2px 10px rgba(0,0,0,.55);cursor:pointer;white-space:nowrap;letter-spacing:.2px;pointer-events:auto}
.ped-sig.walk{color:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(34,232,122,.35)}
.veh{position:absolute;z-index:40;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .15s,filter .15s;user-select:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.veh:hover{z-index:80;filter:drop-shadow(0 0 7px #38c7e8) brightness(1.15)}.veh.stopped{opacity:.62}.veh.braking{opacity:.82}
.mkr{position:absolute;z-index:45;transform:translate(-50%,-50%);background:#060d1a;border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:10px;font-weight:900;white-space:nowrap;pointer-events:none}
.mkr.red{color:var(--red);border-color:var(--red)}.mkr.blue{color:var(--blue);border-color:var(--blue)}.mkr.green{color:var(--green);border-color:var(--green)}.mkr.yellow{color:var(--yellow);border-color:var(--yellow)}.mkr.orange{color:var(--orange);border-color:var(--orange)}
.effect-badge{position:absolute;z-index:46;transform:translate(-50%,-50%);border:1.5px solid var(--blue);border-radius:8px;background:rgba(6,13,26,.9);padding:4px 8px;font-size:10px;font-weight:900;color:#a8e8ff;white-space:nowrap;animation:effPop 2s ease-in-out infinite;pointer-events:none}
@keyframes effPop{0%,100%{opacity:.82;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}
#side{background:#080f1e;border-left:2px solid #1e3a5c;display:flex;flex-direction:column;overflow:hidden}
.side-section{padding:13px 14px 10px;border-bottom:1px solid var(--divider);flex-shrink:0}.side-section:last-child{border-bottom:none;flex:1;overflow:hidden;display:flex;flex-direction:column}
.sec-title{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:6px}.sec-title::before{content:"";width:3px;height:11px;background:var(--blue);border-radius:2px;display:inline-block}
.effect-cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}.ec{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:9px;text-align:center}.ec .ev{font-size:20px;font-weight:900;color:var(--green);margin-bottom:2px;font-family:monospace}.ec .el{font-size:10px;color:var(--muted);line-height:1.35}.ec.highlight{border-color:var(--blue);background:rgba(26,184,232,.06)}.ec.highlight .ev{color:var(--blue)}
.cmp-row2{display:grid;grid-template-columns:70px 1fr 1fr;gap:4px;align-items:center;margin-bottom:5px;font-size:10px}.cmp-label{color:var(--muted)}.cmp-no,.cmp-yes{padding:3px 6px;border-radius:4px;text-align:center;font-weight:800;font-size:10px}.cmp-no{background:#1a2a40;color:var(--muted);border:1px solid var(--border)}.cmp-yes{background:rgba(26,184,232,.12);color:var(--blue);border:1px solid rgba(26,184,232,.3)}
.flow-steps{display:flex;flex-direction:column;gap:6px}.fs{display:flex;gap:8px;align-items:flex-start;opacity:.35;transition:opacity .3s}.fs.active{opacity:1}.fs-num{width:22px;height:22px;border-radius:50%;background:#0f1e35;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:var(--blue);flex-shrink:0}.fs.active .fs-num{background:rgba(26,184,232,.15);border-color:var(--blue)}.fs-text b{display:block;font-size:11px;margin-bottom:2px}.fs-text span{font-size:10px;color:var(--muted);line-height:1.35}
.fair-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:10px}.fair-label{width:44px;color:var(--muted);flex-shrink:0}.fair-track{flex:1;height:5px;background:#07101d;border-radius:999px;overflow:hidden}.fair-fill{height:100%;background:var(--purple);width:0%;transition:width .9s cubic-bezier(.22,1,.36,1);border-radius:999px}.fair-val{width:24px;text-align:right;font-weight:800;color:var(--text)}
.event-list{display:flex;flex-direction:column;gap:4px}.ev-item{display:grid;grid-template-columns:18px 1fr auto;gap:6px;align-items:center;background:#0a1525;border:1px solid var(--border);border-radius:6px;padding:5px 7px;font-size:10px}.ev-item small{font-family:monospace;font-size:9px;color:var(--muted)}
.log-scroll{overflow-y:auto;flex:1}.log-item{display:grid;grid-template-columns:auto auto 1fr;gap:6px;padding:5px 0;border-bottom:1px solid rgba(30,48,80,.5);align-items:flex-start;animation:slideIn .25s forwards}@keyframes slideIn{from{opacity:0;transform:translateX(4px)}to{opacity:1;transform:none}}.li-time{font-family:monospace;font-size:9px;color:var(--muted);margin-top:1px}.li-text{font-size:10px;color:#c0d8f0;line-height:1.35}.li-tag{font-size:9px;font-weight:900;padding:1px 5px;border-radius:3px}.li-tag.ai{background:rgba(26,184,232,.2);color:var(--blue)}.li-tag.warn{background:rgba(232,64,64,.2);color:var(--red)}.li-tag.ok{background:rgba(34,232,122,.15);color:var(--green)}
.tip{position:fixed;z-index:300;background:#09162a;border:1px solid var(--blue);border-radius:10px;padding:9px 12px;font-size:11px;pointer-events:none;min-width:210px;box-shadow:0 4px 20px rgba(0,0,0,.6);display:none}.tip b{display:block;color:var(--blue);margin-bottom:5px;font-size:12px}.tip .tr{display:flex;justify-content:space-between;gap:10px;margin-top:3px;color:var(--muted)}.tip .tr span{color:var(--text);font-weight:800;text-align:right}.tip-green{border-color:var(--green)}.tip-green b{color:var(--green)}
@media(max-width:1100px){body{overflow:auto}#app{grid-template-columns:1fr;height:auto}.map-col{height:620px}#side{height:620px}}
</style>
</head>
<body>
<div id="header">
  <h1>🏙 중앙 <span>AI</span> 도시 교통 통합 관제 시스템 — 장주기 신호/횡단보도 비교</h1>
  <div class="hright">
    <div class="scen-btns">
      <button class="sbtn active" id="btn-normal" onclick="runScenario('normal')">기본 상태</button>
      <button class="sbtn" id="btn-accident" onclick="runScenario('accident')">사고·공사</button>
      <button class="sbtn" id="btn-metro" onclick="runScenario('metro')">지하철 도착</button>
      <button class="sbtn" id="btn-emergency" onclick="runScenario('emergency')">긴급차량</button>
    </div>
    <div style="display:flex;align-items:center;gap:6px"><div class="pulse-dot"></div><span class="live-label">LIVE</span></div>
  </div>
</div>
<div id="app">
  <div class="map-col"><div class="map-area" id="mapNo"></div><div class="map-header"><span class="map-label-no">⛔ AI 미적용 — 일반 신호 시스템</span></div></div>
  <div class="map-col"><div class="map-area" id="mapAi"></div><div class="map-header"><span class="map-label-ai">✦ AI 적용 — 중앙 지능형 제어</span></div></div>
  <div id="side">
    <div class="side-section"><div class="sec-title">개선 효과</div><div class="effect-cards">
      <div class="ec highlight"><div class="ev" id="ec1v">—</div><div class="el">대기시간<br>감소</div></div>
      <div class="ec"><div class="ev" id="ec2v">—</div><div class="el">혼잡도<br>감소</div></div>
      <div class="ec"><div class="ev" id="ec3v">—</div><div class="el">탄소배출<br>감소</div></div>
      <div class="ec"><div class="ev" id="ec4v">—</div><div class="el" id="ec4l">공회전<br>감소</div></div>
    </div></div>
    <div class="side-section"><div class="sec-title">수치 비교</div><div id="cmpBar"></div></div>
    <div class="side-section"><div class="sec-title">AI 판단 흐름</div><div class="flow-steps">
      <div class="fs" id="fs1"><div class="fs-num">1</div><div class="fs-text"><b>입력 수집</b><span>도로·신호·보행자·대중교통 통합</span></div></div>
      <div class="fs" id="fs2"><div class="fs-num">2</div><div class="fs-text"><b>혼잡 예측</b><span>30초 후 혼잡·보행자 대기 예측</span></div></div>
      <div class="fs" id="fs3"><div class="fs-num">3</div><div class="fs-text"><b>제어 실행</b><span>직진·좌회전 phase와 횡단보도 조정</span></div></div>
      <div class="fs" id="fs4"><div class="fs-num">4</div><div class="fs-text"><b>효과 추정</b><span>대기·공회전·탄소 감소 계산</span></div></div>
    </div></div>
    <div class="side-section"><div class="sec-title">공정성 점수</div><div id="fairRows"></div></div>
    <div class="side-section" style="flex:1;min-height:0;display:flex;flex-direction:column"><div class="sec-title">AI 판단 로그</div><div class="event-list" id="eventList" style="margin-bottom:8px;flex-shrink:0"></div><div class="log-scroll" id="logList"></div></div>
  </div>
</div>
<div class="tip" id="vTip"></div><div class="tip tip-green" id="sTip"></div>
<script>
const TICK=70;
const NODES={A:{x:10,y:16},B:{x:34,y:16},C:{x:58,y:16},D:{x:82,y:16},E:{x:10,y:43},F:{x:34,y:43},G:{x:58,y:43},H:{x:82,y:43},I:{x:10,y:70},J:{x:34,y:70},K:{x:58,y:70},L:{x:82,y:70}};
const ROAD_DEFS=[['A','B'],['B','C'],['C','D'],['E','F'],['F','G'],['G','H'],['I','J'],['J','K'],['K','L'],['A','E'],['E','I'],['B','F'],['F','J'],['C','G'],['G','K'],['D','H'],['H','L'],['B','G'],['F','K']];
const ROAD_META={'A-B':{name:'A↔B 간선로'},'B-C':{name:'B↔C 간선로'},'C-D':{name:'C↔D 간선로'},'E-F':{name:'E↔F 중심로'},'F-G':{name:'F↔G 혼잡구간'},'G-H':{name:'G↔H 동측로'},'I-J':{name:'I↔J 물류로'},'J-K':{name:'J↔K 역전로'},'K-L':{name:'K↔L 주거로'},'B-G':{name:'B↔G 대각선'},'F-K':{name:'F↔K 우회로'},'A-E':{name:'A↔E 북측로'},'E-I':{name:'E↔I 남북로'},'B-F':{name:'B↔F 중앙로'},'F-J':{name:'F↔J 중앙남'},'C-G':{name:'C↔G 중간로'},'G-K':{name:'G↔K 역세권'},'D-H':{name:'D↔H 동북로'},'H-L':{name:'H↔L 동남로'}};
const SCEN_BASE={normal:42,accident:76,metro:54,emergency:62};
const SCEN_ROAD_BOOST={normal:{'F-G':15,'B-C':8,'J-K':10},accident:{'F-G':40,'C-G':22,'B-C':20,'G-K':18,'G-H':14,'E-F':12,'J-K':10},metro:{'F-G':16,'G-K':23,'C-G':15,'G-H':17,'J-K':19},emergency:{'F-G':13,'F-J':11,'J-K':8}};
const SCEN_AI_ROADS={normal:['B-C','F-J'],accident:['B-G','F-K','F-J'],metro:['C-G','G-K','G-H'],emergency:['A-B','B-C','C-D','D-H','H-L']};
const SCEN_EMERG_ROADS={emergency:['A-B','B-C','C-D','D-H','H-L']};
const CROSSWALKS=[{id:'CW1',road:'B-C',pos:.5},{id:'CW2',road:'F-G',pos:.48},{id:'CW3',road:'G-K',pos:.52},{id:'CW4',road:'J-K',pos:.45},{id:'CW5',road:'D-H',pos:.48}];
const PHASES=[
  {id:'EW_STRAIGHT',label:'동서 직진',dir:'EW',move:'straight'},
  {id:'EW_LEFT',label:'동서 좌회전',dir:'EW',move:'left'},
  {id:'NS_STRAIGHT',label:'남북 직진',dir:'NS',move:'straight'},

  {id:'ALL_YELLOW',label:'전체 황색',dir:'ALL',move:'yellow'}
];
const COMPARE_DATA={normal:[['도시 혼잡도','51%','42%'],['평균 대기','47초','35초'],['탄소배출','기준','-5%']],accident:[['도시 혼잡도','90%','76%'],['평균 대기','98초','68초'],['공회전','기준','-22%']],metro:[['버스 대기','9분','4분'],['역 주변 혼잡','74%','54%'],['승객 처리','기준','+32%']],emergency:[['응급 도착','7분 40초','5분 20초'],['경로 신호','일반','녹색 고정'],['지연 차량','보통','F/J 대기']]};
const EFFECT_DATA={normal:['25%','9%','5%','8%','공회전'],accident:['31%','14%','13%','22%','공회전'],metro:['55%','20%','10%','배차 단축','버스 배차'],emergency:['+2분 20초','18%','11%','긴급 도착','긴급 단축']};

    })}
  addMkr(txt,x,y,type){const m=document.createElement('div');m.className='mkr '+type;m.textContent=txt;m.style.left=x+'%';m.style.top=y+'%';this.container.appendChild(m);this.dynEls.push(m)}
  addEffectBadge(txt,x,y){const m=document.createElement('div');m.className='effect-badge';m.textContent=txt;m.style.left=x+'%';m.style.top=y+'%';this.container.appendChild(m);this.dynEls.push(m)}
  clear(){this.dynEls.forEach(e=>e.remove());this.dynEls=[];this.vehicles=[];this.signals={};this.sigEls={};this.phaseTags={};this.crosswalks={};Object.values(this.roadEls).forEach(r=>r.className='road')}
}
const mapNo=new TrafficMap('mapNo',false),mapAi=new TrafficMap('mapAi',true);let curScen='normal';
function addCoreSignals(map,type,isAI){
  ['B','F','G','J','H','C','D','K'].forEach((id,i)=>{
    // 일반 신호는 모든 교차로가 같은 고정 cycle로 움직이게 해서
    // 발표자가 보기에도 “랜덤이 아니라 주기 신호”로 보이도록 동기화한다.
    // AI 신호는 기존처럼 교차로별 phase offset을 둔다.
    let profile={startIdx:isAI?i%4:0};
    let managed=['F','G','J','K','B','C','D','H'].includes(id);
    if(type==='emergency'&&isAI&&['B','C','D','H'].includes(id))profile.lockedPhase=roadDir('A','B')==='EW'?'EW_STRAIGHT':'NS_STRAIGHT';
    if(isAI&&type==='accident'&&['F','J'].includes(id))profile.boost='NS';
    if(isAI&&type==='metro'&&['G','K'].includes(id))profile.boost='NS';
    map.createSig(id,managed,profile)
  })
}
function addCrosswalks(map){CROSSWALKS.forEach(c=>map.createCrosswalk(c.id,c.road,c.pos,true))}
function addFleet(map,items){
  items.forEach((it,i)=>{
    // 출발 지점을 더 넓게 분산해서 같은 위치 출발/겹침 감소
    const offset=((i*0.233)+(i%3)*0.071)%0.92;
    map.addVeh(it[0],it[1],it[2],!!it[3],it[4]||{},offset)
  })
}
function commonFleet(mult=1){const base=[
['🚗',['A','B','C','D','H','L','K','J','I','E','A'],.008,false,{type:'승용차',speed:'45km/h'}],
['🚌',['I','J','F','B','C','G','K','J','I'],.007,false,{type:'버스',speed:'35km/h'}],
['🚛',['I','J','K','L','H','G','F','J','I'],.0058,false,{type:'화물트럭',speed:'32km/h'}],
['🚗',['E','F','B','C','G','K','J','I','E'],.0068,false,{type:'승용차'}],
['🚗',['D','H','L','K','J','F','G','C','D'],.0074,false,{type:'승용차'}],
['🚗',['L','K','J','F','B','C','G','H','L'],.006,false,{type:'승용차'}],
['🚕',['B','F','J','K','G','C','B'],.0078,false,{type:'택시'}],
['🚌',['E','F','G','H','D','C','B','A','E'],.0064,false,{type:'버스'}],
['🚗',['A','E','I','J','K','G','C','B','A'],.0067,false,{type:'승용차'}],
['🚗',['G','F','B','C','D','H','G'],.0059,false,{type:'승용차'}],
['🚗',['C','G','K','L','H','D','C'],.0069,false,{type:'승용차'}],
['🚛',['K','J','F','E','I','J','K'],.0052,false,{type:'화물트럭'}],
['🚗',['B','C','G','F','J','K','G','C','B'],.0061,false,{type:'승용차'}],
['🚕',['H','G','F','B','C','D','H'],.0075,false,{type:'택시'}]
];return base.slice(0,Math.round(base.length*mult))}
function runScenario(type){curScen=type;document.querySelectorAll('.sbtn').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+type)?.classList.add('active');mapNo.clear();mapAi.clear();mapNo.initTraffic(type);mapAi.initTraffic(type);setupScenario(mapNo,type,false);setupScenario(mapAi,type,true);updateEffectCards(type);updateCompare(type);updateFair(type);updateFlowSteps(type);updateLog(type);updateEvents(type);updateCongestion()}
function setupScenario(map,type,isAI){
  addCoreSignals(map,type,isAI);addCrosswalks(map);
  if(type==='normal'){if(isAI)map.addEffectBadge('AI: phase 선제 조정',42,32);addFleet(map,commonFleet(1.05))}
  if(type==='accident'){map.addMkr('⚠️ 사고·공사',58,43,'red');if(isAI){map.addEffectBadge('AI: 우회 직진 phase 연장',34,60);map.addMkr('✦ 우회 경로',34,72,'orange');addFleet(map,[['🚗',['E','I','J','K','L','H','G','F','E'],.0075,false,{type:'승용차(우회)',aiCmd:'F-G 회피'}],['🚛',['I','J','K','L','H','G','F','J','I'],.0068,false,{type:'화물(우회)',aiCmd:'우회 재계산'}],['🚗',['A','B','G','K','J','F','E','A'],.006,false,{type:'승용차(대각 우회)'}],['🚌',['E','F','J','K','L','H','D','C','B','A','E'],.006,false,{type:'버스(우회)'}]])}else{map.addMkr('정체 대기열',47,43,'red');addFleet(map,[['🚗',['E','F','G','H','L','K','J','I','E'],.0038,false,{type:'승용차(정체)'}],['🚗',['E','F','G','H','L','K','J','I','E'],.0036,false,{type:'승용차(정체)'}],['🚗',['B','C','G','K','J','F','B'],.0037,false,{type:'승용차(정체)'}],['🚛',['I','J','K','G','F','J','I'],.0032,false,{type:'화물(정체)'}]])}addFleet(map,commonFleet(1.1))}
  if(type==='metro'){map.addMkr('🚇 지하철 도착',58,70,'blue');if(isAI){map.addEffectBadge('버스 진행 phase + 보행자 조정',58,58);addFleet(map,[['🚌',['I','J','F','G','K','L','H','D','C','G','I'],.012,false,{type:'버스(증차)',aiCmd:'배차 단축'}],['🚌',['E','F','G','H','D','C','B','A','E'],.011,false,{type:'마을버스'}],['🚌',['L','K','G','C','D','H','L'],.0095,false,{type:'버스(증차)'}],['🚕',['K','G','F','B','C','G','K'],.01,false,{type:'택시'}]])}else{map.addMkr('버스 정체',50,58,'red');addFleet(map,[['🚌',['I','J','K','G','F','J','I'],.0044,false,{type:'버스(지연)'}],['🚌',['E','F','G','K','J','I','E'],.004,false,{type:'버스(지연)'}]])}addFleet(map,commonFleet(1.15))}
  if(type==='emergency'){map.addMkr('🚨 긴급출동',10,16,'red');map.addMkr('🏥 목적지',82,70,isAI?'green':'yellow');if(isAI){map.addEffectBadge('긴급 경로 phase 우선 + 보행 STOP',58,16);map.addVeh('🚑',['A','B','C','D','H','L','K','J','I','E','A'],.023,true,{type:'구급차',speed:'82km/h',aiCmd:'긴급 phase 우선'},.02)}else{map.addVeh('🚑',['A','B','C','D','H','L','K','J','I','E','A'],.0078,false,{type:'구급차(신호대기)',speed:'38km/h'},.02)}addFleet(map,commonFleet(1.2))}
}
function updateEffectCards(type){
  // 초기 표시값만 넣고, 실제 수치는 updateDynamicEffects()에서 계속 계산
  ec1v.textContent='계산중';
  ec2v.textContent='계산중';
  ec3v.textContent='계산중';
  ec4v.textContent='계산중';
  ec4l.textContent=(type==='metro'?'버스 배차':'공회전')+'\n감소'
}
function updateCompare(type){cmpBar.innerHTML=(COMPARE_DATA[type]||[]).map(([k,b,a])=>`<div class="cmp-row2"><span class="cmp-label">${k}</span><span class="cmp-no">${b}</span><span class="cmp-yes">${a}</span></div>`).join('')}
function updateFair(type){fairRows.innerHTML=(FAIR_DATA[type]||FAIR_DATA.normal).map(([l,v])=>`<div class="fair-row"><span class="fair-label">${l}</span><div class="fair-track"><div class="fair-fill" data-w="${v}%"></div></div><span class="fair-val">${v}</span></div>`).join('');requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.fair-fill').forEach(e=>e.style.width=e.dataset.w)))}
function updateFlowSteps(type){const active=type==='normal'?[1,2]:[1,2,3,4];[1,2,3,4].forEach(i=>document.getElementById('fs'+i)?.classList.toggle('active',active.includes(i)))}
function updateLog(type){const items=LOG_DATA[type]||[],list=logList;list.innerHTML='';const now=new Date();items.forEach((item,i)=>setTimeout(()=>{const d=new Date(now-(items.length-1-i)*3200),ts=[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':'),tag=item[0],txt=item[1],tagCls=tag==='AI'?'ai':tag==='경고'?'warn':'ok';const div=document.createElement('div');div.className='log-item';div.innerHTML=`<span class="li-time">${ts}</span><span class="li-tag ${tagCls}">${tag}</span><span class="li-text">${txt}</span>`;list.prepend(div);while(list.children.length>5)list.removeChild(list.lastChild)},i*180))}
let evIdx=0;function updateEvents(type){evIdx=0;renderEvents(type)}
function renderEvents(type){const arr=EVENT_DATA[type]||EVENT_DATA.normal,pick=[];for(let i=0;i<3;i++)pick.push(arr[(evIdx+i)%arr.length]);const now=new Date();eventList.innerHTML=pick.map((t,i)=>`<div class="ev-item"><span>${t.slice(0,2)}</span><span>${t.slice(3)}</span><small>${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String((now.getSeconds()+i*3)%60).padStart(2,'0')}</small></div>`).join('');evIdx++}

function stoppedRatio(map){
  if(!map.vehicles.length)return 0;
  const stopped=map.vehicles.filter(v=>v.stopped||v.braking).length;
  return stopped/map.vehicles.length;
}

function avgVehicleSpeed(map){
  if(!map.vehicles.length)return 0;
  return map.vehicles.reduce((sum,v)=>sum+(v.speed||0),0)/map.vehicles.length;
}

function pctImprove(before,after){
  if(before<=0)return 0;
  return clamp(Math.round(((before-after)/before)*100),0,99);
}

function updateDynamicEffects(){
  const noCong=mapNo.avgCongestion();
  const aiCong=mapAi.avgCongestion();

  const noStop=stoppedRatio(mapNo);
  const aiStop=stoppedRatio(mapAi);

  const noSpeed=avgVehicleSpeed(mapNo);
  const aiSpeed=avgVehicleSpeed(mapAi);

  // 대기시간 감소: 정지/감속 차량 비율 차이를 기반으로 계산
  const waitReduce=pctImprove(noStop,aiStop);

  // 혼잡도 감소: 좌측 평균 혼잡도와 우측 평균 혼잡도 비교
  const congReduce=pctImprove(noCong,aiCong);

  // 탄소배출 감소: 혼잡도 감소와 정지차량 감소를 섞은 추정값
  const carbonReduce=clamp(Math.round(congReduce*0.45+waitReduce*0.35),0,45);

  // 공회전 감소: 정지 차량 비율 감소를 그대로 더 크게 반영
  const idleReduce=clamp(Math.round(waitReduce*0.9+congReduce*0.2),0,80);

  // 지하철/긴급차량 시나리오는 목적이 다르므로 보조 지표만 문구 조정
  if(curScen==='metro'){
    const busImprove=clamp(Math.round((aiSpeed-noSpeed)/(noSpeed||0.001)*100),0,80);
    ec4v.textContent=(busImprove||idleReduce)+'%';
    ec4l.textContent='버스 흐름\n개선';
  }else if(curScen==='emergency'){
    const emsNo=mapNo.vehicles.find(v=>v.meta?.type?.includes('구급차'));
    const emsAi=mapAi.vehicles.find(v=>v.meta?.type?.includes('구급차'));
    const emsImprove=emsNo&&emsAi?clamp(Math.round(((emsAi.speed||0)-(emsNo.speed||0))/((emsNo.speed||0)||0.001)*100),0,200):idleReduce;
    ec4v.textContent='+'+emsImprove+'%';
    ec4l.textContent='긴급차량\n속도';
  }else{
    ec4v.textContent=idleReduce+'%';
    ec4l.textContent='공회전\n감소';
  }

  ec1v.textContent=waitReduce+'%';
  ec2v.textContent=congReduce+'%';
  ec3v.textContent=carbonReduce+'%';
}

function updateCongestion(){updateDynamicEffects()}
let loopId=null,slowId=null,evId=null;function startLoop(){if(loopId)clearInterval(loopId);if(slowId)clearInterval(slowId);if(evId)clearInterval(evId);loopId=setInterval(()=>{mapNo.tickSignals();mapNo.tickVehicles();mapAi.tickSignals();mapAi.tickVehicles();updateDynamicEffects()},TICK);slowId=setInterval(()=>{mapNo.updateTraffic();mapAi.updateTraffic();updateCongestion()},1000);evId=setInterval(()=>renderEvents(curScen),2400)}
runScenario('normal');startLoop();
</script>
